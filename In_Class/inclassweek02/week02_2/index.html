<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Class Cookbook — Submit a Recipe</title>
  </head>

  <body>
    <h1>Class Cookbook</h1>

    <p>Submit a recipe to our Class Cookbook!</p>

    <form name="recipeForm" method="GET">

      <fieldset>
        <legend>Who is cooking?</legend>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required />

        <br /><br />

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required />
      </fieldset>


      <fieldset>
        <legend>Set Up User Account</legend>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <br /><br />

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />

        <br /><br />

        <label for="userBio">Bio:</label>
        <br />
        <textarea
          id="userBio"
          name="userBio"
          rows="5"
          cols="40"
          placeholder="Tell us about yourself"
        ></textarea>
      </fieldset>


      <fieldset>
        <legend>The Recipe</legend>

        <label for="recipeName">Recipe Name:</label>
        <input type="text" id="recipeName" name="recipeName" />

        <br /><br />

        <label for="servings">Servings:</label>
        <input type="number" id="servings" name="servings" />

        <br /><br />

        <label for="category">Category:</label>
        <select id="category" name="category">
          <option>Breakfast</option>
          <option>Lunch</option>
          <option>Dinner</option>
          <option>Dessert</option>
        </select>
      </fieldset>


      <fieldset>
        <legend>How hard is it?</legend>

        <label>
          <input type="radio" name="difficulty" value="easy" />
          Easy
        </label>

        <label>
          <input type="radio" name="difficulty" value="medium" />
          Medium
        </label>

        <label>
          <input type="radio" name="difficulty" value="hard" />
          Hard
        </label>
      </fieldset>


      <fieldset>
        <legend>Dietary Tags</legend>

        <label>
          <input type="checkbox" name="diet" value="vegetarian" />
          Vegetarian
        </label>

        <label>
          <input type="checkbox" name="diet" value="vegan" />
          Vegan
        </label>

        <label>
          <input type="checkbox" name="diet" value="gluten-free" />
          Gluten-Free
        </label>
      </fieldset>


      <fieldset>
        <legend>The Actual Food</legend>

        <label for="ingredients">Ingredients:</label>
        <br />
        <textarea id="ingredients" name="ingredients" rows="8" cols="40"></textarea>

        <br /><br />

        <label for="instructions">Instructions:</label>
        <br />
        <textarea id="instructions" name="instructions" rows="8" cols="40"></textarea>
      </fieldset>


      <fieldset>
        <legend>Extras</legend>

        <label for="photo">Upload a Photo:</label>
        <input type="file" id="photo" name="photo" />

        <br /><br />

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" />

        <br /><br />

        <label for="color">Pick a Color:</label>
        <input type="color" id="color" name="color" />
      </fieldset>

      <br />

      <button type="submit">Submit Recipe</button>
      <button type="reset">Reset</button>

    </form>

  </body>
</html>
